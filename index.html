<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIGHTWEIGHT AIM & COMBAT ARENA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #08080c; font-family: monospace; }
        #canvas-container { width: 100%; height: 100%; position: absolute; }

        /* Crisp Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            pointer-events: none; z-index: 10;
        }
        #crosshair::before {
            content: ''; position: absolute; top: 4px; left: 0; width: 10px; height: 2px; background: #00ffcc;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 0; left: 4px; width: 2px; height: 10px; background: #00ffcc;
        }

        /* Hitmarker */
        #hitmarker {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 16px; height: 16px; pointer-events: none; display: none; z-index: 11;
        }
        .hm { position: absolute; background: #ff0055; }
        .hm-v { left: 7px; top: 0; width: 2px; height: 16px; }
        .hm-h { top: 7px; left: 0; width: 16px; height: 2px; }

        /* Damage Flash Overlay */
        #damage-flash {
            position: absolute; width: 100%; height: 100%;
            pointer-events: none; z-index: 9;
            background: rgba(255, 0, 0, 0);
            transition: background 0.05s ease-out;
        }

        /* Minimal HUD */
        #ui {
            position: absolute; top: 15px; left: 20px;
            pointer-events: none; z-index: 5;
            color: #00ffcc; font-size: 14px; font-weight: bold;
            line-height: 1.6;
        }
        .fps-display { color: #ffff00; }
        .rt-display { color: #ff00ff; }
        .hp-display { color: #00ff66; }

        /* Menus */
        #blocker {
            position: absolute; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; color: #fff; text-align: center;
        }
        .menu-card { display: none; }
        .menu-card.active { display: block; }

        h1 { color: #00ffcc; font-size: 26px; margin-bottom: 6px; letter-spacing: 2px; }
        p { color: #aaa; font-size: 12px; margin-bottom: 16px; }

        .btn {
            background: #00ffcc; border: none; padding: 10px 22px;
            color: #000; font-weight: bold; font-family: monospace;
            cursor: pointer; font-size: 13px; margin: 4px;
        }
        .btn:hover { background: #fff; }
        .btn-secondary { background: #222233; color: #00ffcc; border: 1px solid #00ffcc; }
        .btn-secondary:hover { background: #00ffcc; color: #000; }

        .mode-select { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .mode-btn {
            background: #181824; border: 1px solid #00ffcc; padding: 6px 14px;
            color: #00ffcc; font-weight: bold; font-family: monospace;
            cursor: pointer; font-size: 12px;
        }
        .mode-btn.active { background: #00ffcc; color: #000; }

        .sub-btn {
            background: #101018; border: 1px solid #ff0055; padding: 4px 10px;
            color: #ff0055; font-weight: bold; font-family: monospace;
            cursor: pointer; font-size: 11px;
        }
        .sub-btn.active { background: #ff0055; color: #fff; }

        .row { 
            margin-top: 8px; font-size: 11px; color: #ccc; 
            display: flex; gap: 10px; justify-content: space-between; 
            align-items: center; width: 290px; margin-left: auto; margin-right: auto;
        }
        input[type="range"] { accent-color: #00ffcc; cursor: pointer; }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="damage-flash"></div>
    <div id="hitmarker">
        <div class="hm hm-v"></div>
        <div class="hm hm-h"></div>
    </div>

    <div id="ui">
        FPS: <span id="fps-val" class="fps-display">--</span><br>
        TIME: <span id="time-val">00:00.0</span><br>
        SCENE: <span id="hud-scene">TRAINER</span> | <span id="hud-mode">FLICK (HITSCAN)</span><br>
        <span id="hp-row" style="display:none;">HP: <span id="hp-val" class="hp-display">100</span><br></span>
        SCORE: <span id="score-val">0</span><br>
        <span id="stat-row">ACCURACY: <span id="acc-val">100%</span></span><br>
        <span id="streak-row">STREAK: <span id="streak-val">0</span></span><br>
        <span id="rt-row">LAST RT: <span id="rt-val" class="rt-display">-- ms</span> (AVG: <span id="avg-rt-val" class="rt-display">-- ms</span>)</span>
    </div>

    <div id="blocker">
        <!-- 1. ROOT HUB MENU -->
        <div id="root-menu" class="menu-card active">
            <h1>CHOOSE SIMULATION</h1>
            <p>1:1 ZERO-LATENCY ENGINE</p>
            <button class="btn" onclick="showSubMenu('trainer')">1. AIM TRAINER</button><br>
            <button class="btn" onclick="showSubMenu('fps')">2. BAREBONES FPS COMBAT</button>
            <div class="row" style="margin-top: 20px;">
                <label for="sens">Sensitivity:</label>
                <input type="range" id="sens" min="0.2" max="3.0" step="0.1" value="1.0">
                <span id="sens-val">1.0</span>
            </div>
        </div>

        <!-- 2. AIM TRAINER CONFIG MENU -->
        <div id="trainer-menu" class="menu-card">
            <h1>AIM TRAINER CONFIG</h1>
            <p>ISOLATED TARGET DRILLS</p>
            <div class="mode-select">
                <button class="mode-btn active" id="flick-tab" onclick="setFiringMode('flick')">FLICK</button>
                <button class="mode-btn" id="track-tab" onclick="setFiringMode('track')">TRACKING</button>
            </div>
            <div id="flick-sub-menu" class="mode-select">
                <button class="sub-btn active" id="type-hitscan" onclick="setFlickType('hitscan')">HITSCAN</button>
                <button class="sub-btn" id="type-proj" onclick="setFlickType('projectile')">PROJECTILE</button>
            </div>
            <button class="btn" onclick="startGame('trainer')">START DRILL</button>
            <button class="btn btn-secondary" onclick="showSubMenu('root')">BACK</button>
            <div class="row">
                <label for="speed">Target Speed:</label>
                <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
                <span id="speed-val">1.0x</span>
            </div>
            <div class="row" id="proj-row">
                <label for="proj-speed">Proj Speed (m/s):</label>
                <input type="range" id="proj-speed" min="60" max="350" step="10" value="160">
                <span id="proj-val">160 (Web Cluster)</span>
            </div>
        </div>

        <!-- 3. BAREBONES FPS COMBAT MENU -->
        <div id="fps-menu" class="menu-card">
            <h1>COMBAT ARENA</h1>
            <p>ENEMIES PEEK COVER & FIRE AT YOU</p>
            <div class="mode-select">
                <button class="mode-btn active" id="fps-flick-tab" onclick="setFiringMode('flick')">FLICK (POP ENEMIES)</button>
                <button class="mode-btn" id="fps-track-tab" onclick="setFiringMode('track')">TRACKING (MELT BEAM)</button>
            </div>
            <div id="fps-flick-sub" class="mode-select">
                <button class="sub-btn active" id="fps-type-hitscan" onclick="setFlickType('hitscan')">HITSCAN</button>
                <button class="sub-btn" id="fps-type-proj" onclick="setFlickType('projectile')">WEB CLUSTER</button>
            </div>
            <button class="btn" onclick="startGame('fps')">DEPLOY TO ARENA</button>
            <button class="btn btn-secondary" onclick="showSubMenu('root')">BACK</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        /* --- AUDIO SYNTHESIS --- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, duration, type = 'triangle', vol = 0.18) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        /* --- THREE.JS ENGINE SETUP --- */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1);
        container.appendChild(renderer.domElement);

        /* --- STATE --- */
        let activeEnvironment = 'trainer'; // 'trainer' or 'fps'
        let firingMode = 'flick'; // 'flick' or 'track'
        let flickType = 'hitscan'; // 'hitscan' or 'projectile'
        let targetSpeedMult = 1.0;
        let projectileVelocity = 160;

        let playerHp = 100;
        let isLocked = false, isMouseDown = false;
        let sens = 0.002, pitch = 0, yaw = 0;
        let score = 0, hits = 0, shots = 0, streak = 0;
        let totalActiveTime = 0, totalTrackingTime = 0;
        let reactionTimes = [];

        /* --- ENVIRONMENTS: MAP GEOMETRIES --- */
        // Trainer Simple Wireframe Box
        const trainerBox = new THREE.Mesh(
            new THREE.BoxGeometry(60, 30, 50),
            new THREE.MeshBasicMaterial({ color: 0x181824, wireframe: true })
        );
        trainerBox.position.set(0, 0, -15);
        scene.add(trainerBox);

        // FPS Map: Floor, Back wall & Cover Pillars
        const fpsGroup = new THREE.Group();
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.MeshBasicMaterial({ color: 0x12121a, wireframe: true }));
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, -5, -15);
        fpsGroup.add(floor);

        const coverGeo = new THREE.BoxGeometry(3.5, 9, 3);
        const coverMat = new THREE.MeshBasicMaterial({ color: 0x222238, wireframe: true });
        const coverPositions = [
            [-14, -0.5, -16], [-5, -0.5, -22], [5, -0.5, -20], [15, -0.5, -17],
            [-9, -0.5, -11], [9, -0.5, -12]
        ];

        coverPositions.forEach(p => {
            const pillar = new THREE.Mesh(coverGeo, coverMat);
            pillar.position.set(p[0], p[1], p[2]);
            fpsGroup.add(pillar);
        });
        fpsGroup.visible = false;
        scene.add(fpsGroup);

        /* --- TARGETS (TRAINER) --- */
        const trainerTargets = [];
        const tGeo = new THREE.IcosahedronGeometry(1.0, 1);
        const flickMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
        const trackMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });

        class TrainerTarget {
            constructor() {
                this.mesh = new THREE.Mesh(tGeo, flickMat);
                this.spawnTime = performance.now();
                scene.add(this.mesh);
                this.reset();
                trainerTargets.push(this);
            }
            reset() {
                this.mesh.position.set((Math.random() - 0.5) * 35, (Math.random() - 0.5) * 16, -12 - Math.random() * 18);
                const baseSpeed = firingMode === 'track' ? 14 + Math.random() * 6 : 9 + Math.random() * 6;
                const angle = Math.random() * Math.PI * 2;
                this.velX = Math.cos(angle) * baseSpeed;
                this.velY = Math.sin(angle) * baseSpeed * 0.7;
                this.velZ = (Math.random() - 0.5) * 6;
                this.switchTimer = 0.3 + Math.random() * 0.7;
                this.spawnTime = performance.now();
            }
            update(delta) {
                this.switchTimer -= delta * targetSpeedMult;
                if (this.switchTimer <= 0) {
                    this.velX += (Math.random() - 0.5) * 14;
                    this.velY += (Math.random() - 0.5) * 12;
                    this.switchTimer = 0.3 + Math.random() * 0.6;
                }
                this.mesh.position.x += this.velX * delta * targetSpeedMult;
                this.mesh.position.y += this.velY * delta * targetSpeedMult;
                this.mesh.position.z += this.velZ * delta * targetSpeedMult;

                if (this.mesh.position.x > 22 || this.mesh.position.x < -22) this.velX *= -1;
                if (this.mesh.position.y > 11 || this.mesh.position.y < -11) this.velY *= -1;
                if (this.mesh.position.z > -8 || this.mesh.position.z < -30) this.velZ *= -1;

                this.mesh.rotation.x += delta * 3 * targetSpeedMult;
                this.mesh.rotation.y += delta * 3 * targetSpeedMult;
            }
        }
        for (let i = 0; i < 4; i++) new TrainerTarget();

        /* --- ENEMIES (FPS COMBAT: PEEK COVER & SHOOT) --- */
        const enemies = [];
        const enemyGeo = new THREE.CylinderGeometry(0.8, 0.8, 2.5, 8);
        const enemyMat = new THREE.MeshBasicMaterial({ color: 0xff2244, wireframe: true });

        class FpsEnemy {
            constructor(coverPos, id) {
                this.mesh = new THREE.Mesh(enemyGeo, enemyMat);
                this.coverX = coverPos[0];
                this.baseY = coverPos[1];
                this.coverZ = coverPos[2];
                this.peekDir = id % 2 === 0 ? 2.5 : -2.5;
                this.mesh.position.set(this.coverX, this.baseY, this.coverZ);
                this.isPeeking = false;
                this.stateTimer = 1 + Math.random() * 2;
                this.shootCooldown = 0.8 + Math.random();
                this.hp = 60;
                this.spawnTime = performance.now();
                this.mesh.visible = false;
                scene.add(this.mesh);
                enemies.push(this);
            }
            reset() {
                this.hp = 60;
                this.isPeeking = false;
                this.mesh.position.set(this.coverX, this.baseY, this.coverZ);
                this.stateTimer = 1 + Math.random() * 2;
            }
            update(delta) {
                this.stateTimer -= delta;
                if (this.stateTimer <= 0) {
                    this.isPeeking = !this.isPeeking;
                    this.stateTimer = this.isPeeking ? (1.5 + Math.random() * 1.5) : (1.0 + Math.random() * 2.0);
                    if (this.isPeeking) {
                        this.spawnTime = performance.now();
                        this.shootCooldown = 0.6 + Math.random() * 0.5; // Reaction delay before shooting you
                    }
                }

                // Smooth interpolate out of and back into cover
                const destX = this.isPeeking ? (this.coverX + this.peekDir) : this.coverX;
                this.mesh.position.x += (destX - this.mesh.position.x) * 8 * delta;

                // Enemy shooting logic while peeking
                if (this.isPeeking && isLocked) {
                    this.shootCooldown -= delta;
                    if (this.shootCooldown <= 0) {
                        this.fireAtPlayer();
                        this.shootCooldown = 1.2 + Math.random() * 0.8;
                    }
                }
            }
            fireAtPlayer() {
                // Enemy shoots a red tracer beam at the player
                renderBeam(this.mesh.position, 0xff0000, 0.08);
                playTone(180, 0.08, 'sawtooth', 0.25);
                playerHp -= 15;
                flashDamage();
                document.getElementById('hp-val').textContent = Math.max(0, playerHp);
                if (playerHp <= 0) {
                    playerHp = 100;
                    document.getElementById('hp-val').textContent = 100;
                    streak = 0;
                    document.getElementById('streak-val').textContent = 0;
                    playTone(90, 0.3, 'sawtooth', 0.4);
                }
            }
        }
        coverPositions.forEach((pos, i) => new FpsEnemy(pos, i));

        function flashDamage() {
            const overlay = document.getElementById('damage-flash');
            overlay.style.background = 'rgba(255, 0, 0, 0.35)';
            setTimeout(() => overlay.style.background = 'rgba(255, 0, 0, 0)', 60);
        }

        /* --- PROJECTILES POOL --- */
        const projectiles = [];
        const projGeo = new THREE.BoxGeometry(0.3, 0.3, 0.9);
        const projMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        class Projectile {
            constructor() {
                this.mesh = new THREE.Mesh(projGeo, projMat);
                this.mesh.visible = false;
                this.velocity = new THREE.Vector3();
                this.alive = false;
                scene.add(this.mesh);
                projectiles.push(this);
            }
            fire(origin, direction, speed) {
                this.mesh.position.copy(origin);
                this.velocity.copy(direction).multiplyScalar(speed);
                this.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), direction);
                this.alive = true;
                this.mesh.visible = true;
            }
            update(delta) {
                if (!this.alive) return;
                const prev = this.mesh.position.clone();
                this.mesh.position.addScaledVector(this.velocity, delta);

                const travel = this.mesh.position.clone().sub(prev);
                const ray = new THREE.Raycaster(prev, travel.clone().normalize(), 0, travel.length());
                const targetPool = activeEnvironment === 'trainer' ? trainerTargets.filter(t => t.mesh.visible) : enemies.filter(e => e.mesh.visible);
                const hits = ray.intersectObjects(targetPool.map(t => t.mesh));

                if (hits.length > 0) {
                    const hitObj = targetPool.find(t => t.mesh === hits[0].object);
                    onTargetHit(hitObj, hits[0].point);
                    this.alive = false;
                    this.mesh.visible = false;
                    return;
                }
                if (this.mesh.position.length() > 60 || this.mesh.position.z > 2) {
                    this.alive = false;
                    this.mesh.visible = false;
                }
            }
        }
        for (let i = 0; i < 15; i++) new Projectile();

        /* --- BEAM (INSTANT HITSCAN & TRACKING) --- */
        const beamGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
        const beamMat = new THREE.LineBasicMaterial({ color: 0x00ffff });
        const beam = new THREE.Line(beamGeo, beamMat);
        beam.visible = false;
        scene.add(beam);
        let beamTimer = 0;

        function renderBeam(hitPos, color = 0x00ffff, duration = 0.04) {
            const start = new THREE.Vector3(0.3, -0.25, -0.5).applyMatrix4(camera.matrixWorld);
            const pos = beamGeo.attributes.position.array;
            pos[0] = start.x; pos[1] = start.y; pos[2] = start.z;
            pos[3] = hitPos.x; pos[4] = hitPos.y; pos[5] = hitPos.z;
            beamGeo.attributes.position.needsUpdate = true;
            beamMat.color.setHex(color);
            beam.visible = true;
            beamTimer = duration;
        }

        /* --- UI & MENUS CONTROLLER --- */
        function showSubMenu(menuId) {
            document.querySelectorAll('.menu-card').forEach(m => m.classList.remove('active'));
            document.getElementById(menuId + '-menu').classList.add('active');
        }

        function setFiringMode(mode) {
            firingMode = mode;
            ['flick-tab', 'track-tab', 'fps-flick-tab', 'fps-track-tab'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('active', id.includes(mode));
            });
            document.getElementById('flick-sub-menu').style.display = mode === 'flick' ? 'flex' : 'none';
            document.getElementById('fps-flick-sub').style.display = mode === 'flick' ? 'flex' : 'none';
            document.getElementById('proj-row').style.display = (mode === 'flick' && flickType === 'projectile') ? 'flex' : 'none';
        }

        function setFlickType(type) {
            flickType = type;
            ['type-hitscan', 'type-proj', 'fps-type-hitscan', 'fps-type-proj'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('active', id.includes(type === 'hitscan' ? 'hitscan' : 'proj'));
            });
            document.getElementById('proj-row').style.display = type === 'projectile' ? 'flex' : 'none';
        }

        function startGame(env) {
            activeEnvironment = env;
            trainerBox.visible = (env === 'trainer');
            fpsGroup.visible = (env === 'fps');

            document.getElementById('hud-scene').textContent = env.toUpperCase();
            document.getElementById('hp-row').style.display = (env === 'fps') ? 'inline' : 'none';
            document.getElementById('hud-mode').textContent = firingMode === 'track' ? 'TRACKING' : `FLICK (${flickType.toUpperCase()})`;

            // Configure Environment Entities
            if (env === 'trainer') {
                enemies.forEach(e => e.mesh.visible = false);
                if (firingMode === 'flick') {
                    trainerTargets.forEach(t => { t.mesh.visible = true; t.mesh.material = flickMat; t.reset(); });
                    document.getElementById('stat-row').innerHTML = 'ACCURACY: <span id="acc-val">100%</span>';
                    document.getElementById('streak-row').style.display = 'inline';
                    document.getElementById('rt-row').style.display = 'inline';
                } else {
                    trainerTargets[0].mesh.visible = true;
                    trainerTargets[0].mesh.material = trackMat;
                    trainerTargets[0].reset();
                    for (let i = 1; i < trainerTargets.length; i++) trainerTargets[i].mesh.visible = false;
                    document.getElementById('stat-row').innerHTML = 'TRACK RATE: <span id="acc-val">0%</span>';
                    document.getElementById('streak-row').style.display = 'none';
                    document.getElementById('rt-row').style.display = 'none';
                }
            } else {
                // FPS Combat
                trainerTargets.forEach(t => t.mesh.visible = false);
                enemies.forEach(e => { e.mesh.visible = true; e.reset(); });
                document.getElementById('stat-row').innerHTML = 'ACCURACY: <span id="acc-val">100%</span>';
                document.getElementById('streak-row').style.display = 'inline';
                document.getElementById('rt-row').style.display = 'inline';
            }

            resetStats();
            requestRawPointerLock();
        }

        function resetStats() {
            score = 0; hits = 0; shots = 0; streak = 0;
            totalActiveTime = 0; totalTrackingTime = 0; playerHp = 100;
            reactionTimes = [];
            document.getElementById('score-val').textContent = '0';
            document.getElementById('time-val').textContent = '00:00.0';
            document.getElementById('rt-val').textContent = '-- ms';
            document.getElementById('avg-rt-val').textContent = '-- ms';
            document.getElementById('hp-val').textContent = '100';
            document.getElementById('acc-val').textContent = firingMode === 'flick' ? '100%' : '0%';
            document.getElementById('streak-val').textContent = '0';
        }

        /* --- SHOOTING & COMBAT LOGIC --- */
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);

        function triggerHitmarker() {
            const hm = document.getElementById('hitmarker');
            hm.style.display = 'block';
            setTimeout(() => hm.style.display = 'none', 45);
        }

        function onTargetHit(targetObj, hitPoint) {
            const rt = Math.round(performance.now() - targetObj.spawnTime);
            reactionTimes.push(rt);
            document.getElementById('rt-val').textContent = rt + ' ms';
            document.getElementById('avg-rt-val').textContent = Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length) + ' ms';

            hits++; streak++;
            score += 100 + (streak * 10);
            playTone(520, 0.05);
            triggerHitmarker();
            targetObj.reset();

            document.getElementById('score-val').textContent = score;
            document.getElementById('acc-val').textContent = Math.round((hits / shots) * 100) + '%';
            document.getElementById('streak-val').textContent = streak;
        }

        function fireFlick() {
            shots++;
            if (flickType === 'hitscan') {
                raycaster.setFromCamera(center, camera);
                const pool = activeEnvironment === 'trainer' ? trainerTargets.filter(t => t.mesh.visible) : enemies.filter(e => e.mesh.visible);
                const results = raycaster.intersectObjects(pool.map(t => t.mesh));
                const hitEnd = new THREE.Vector3();

                if (results.length > 0) {
                    const hitObj = pool.find(t => t.mesh === results[0].object);
                    hitEnd.copy(results[0].point);
                    onTargetHit(hitObj, hitEnd);
                } else {
                    streak = 0;
                    raycaster.ray.at(40, hitEnd);
                    document.getElementById('streak-val').textContent = streak;
                    document.getElementById('acc-val').textContent = Math.round((hits / shots) * 100) + '%';
                }
                renderBeam(hitEnd, 0x00ffff, 0.04);
            } else {
                const origin = new THREE.Vector3(0.2, -0.2, -0.4).applyMatrix4(camera.matrixWorld);
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
                const p = projectiles.find(proj => !proj.alive);
                if (p) p.fire(origin, dir, projectileVelocity);
                playTone(720, 0.02);
            }
        }

        function fireTrackingTick(delta) {
            raycaster.setFromCamera(center, camera);
            const pool = activeEnvironment === 'trainer' ? [trainerTargets[0].mesh] : enemies.filter(e => e.mesh.visible).map(e => e.mesh);
            const results = raycaster.intersectObjects(pool);
            const hitEnd = new THREE.Vector3();

            if (results.length > 0) {
                hitEnd.copy(results[0].point);
                totalTrackingTime += delta;
                score += Math.round(delta * 800);
                playTone(280, 0.03);
                triggerHitmarker();
                renderBeam(hitEnd, 0xff0055, 0.03);
            } else {
                raycaster.ray.at(40, hitEnd);
                renderBeam(hitEnd, 0x442233, 0.03);
            }

            document.getElementById('score-val').textContent = score;
            const rate = totalActiveTime > 0 ? Math.round((totalTrackingTime / totalActiveTime) * 100) : 0;
            document.getElementById('acc-val').textContent = rate + '%';
        }

        /* --- CONTROLS & POINTER LOCK --- */
        function requestRawPointerLock() {
            const promise = document.body.requestPointerLock({ unadjustedMovement: true });
            if (promise && promise.catch) promise.catch(() => document.body.requestPointerLock());
        }

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                isLocked = true;
                document.getElementById('blocker').style.display = 'none';
                trainerTargets.forEach(t => t.spawnTime = performance.now());
                enemies.forEach(e => e.spawnTime = performance.now());
            } else {
                isLocked = false;
                isMouseDown = false;
                beam.visible = false;
                document.getElementById('blocker').style.display = 'flex';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            yaw -= e.movementX * sens;
            pitch -= e.movementY * sens;
            pitch = Math.max(-1.54, Math.min(1.54, pitch));
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        });

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0 && isLocked) {
                isMouseDown = true;
                if (firingMode === 'flick') fireFlick();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) isMouseDown = false;
        });

        // Sliders
        document.getElementById('sens').addEventListener('input', (e) => {
            sens = 0.002 * parseFloat(e.target.value);
            document.getElementById('sens-val').textContent = parseFloat(e.target.value).toFixed(1);
        });
        document.getElementById('speed').addEventListener('input', (e) => {
            targetSpeedMult = parseFloat(e.target.value);
            document.getElementById('speed-val').textContent = targetSpeedMult.toFixed(1) + 'x';
        });
        document.getElementById('proj-speed').addEventListener('input', (e) => {
            projectileVelocity = parseInt(e.target.value);
            document.getElementById('proj-val').textContent = projectileVelocity === 160 ? '160 (Web Cluster)' : `${projectileVelocity} m/s`;
        });

        /* --- ENGINE LOOP --- */
        let lastTime = performance.now();
        let frameCount = 0, fpsTimer = 0;

        function animate(now) {
            requestAnimationFrame(animate);
            const delta = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            // Frame Counter
            frameCount++;
            fpsTimer += delta;
            if (fpsTimer >= 0.25) {
                document.getElementById('fps-val').textContent = Math.round(frameCount / fpsTimer);
                frameCount = 0;
                fpsTimer = 0;
            }

            if (isLocked) {
                totalActiveTime += delta;
                const m = Math.floor(totalActiveTime / 60);
                const s = Math.floor(totalActiveTime % 60);
                const t = Math.floor((totalActiveTime * 10) % 10);
                document.getElementById('time-val').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + t;

                if (firingMode === 'track') {
                    if (isMouseDown) fireTrackingTick(delta);
                    else beam.visible = false;
                }
            }

            if (beamTimer > 0) {
                beamTimer -= delta;
                if (beamTimer <= 0 && (!isMouseDown || firingMode !== 'track')) beam.visible = false;
            }

            // Entity Updates
            if (activeEnvironment === 'trainer') {
                trainerTargets.forEach(t => { if (t.mesh.visible) t.update(delta); });
            } else {
                enemies.forEach(e => { if (e.mesh.visible) e.update(delta); });
            }

            projectiles.forEach(p => p.update(delta));
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
